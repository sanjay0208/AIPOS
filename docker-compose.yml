version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: aipos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aipos
      POSTGRES_USER: aipos
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"

  redis:
    image: redis:8
    container_name: aipos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aipos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"

  minio:
    image: minio/minio:latest
    container_name: aipos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: change_me
    ports:
      - "9000:9000"
      - "9001:9001"